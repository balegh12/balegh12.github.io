<!DOCTYPE html>
<html manifest="offline.cache">
<head>
    <meta charset="UTF-8">
    <title>PS4 [5.05] 7.00 - 13.52 FW GoldHEN Host by Mamdouh Balegh</title>
    <style>
        /* إجبار صفحة التهكير الرسمية على قراءة صورتك الشخصية كخلفية ثابتة */
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-image: url("img.jpg") !important;
            background-size: cover !important;
            background-attachment: fixed !important;
            background-repeat: no-repeat !important;
            background-position: center !important;
            color: white !important;
            font-family: sans-serif;
        }
        #msgs { color: #f31414; text-align: center; font-size: 28px; margin-top: 20px; }
        #menu { text-align: center; margin-top: 50px; }
        #progress { font-size: 32px; color: yellow; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <h1 id="msgs">PS4 Exploit Host by Mamdouh Balegh</h1>
    <hr>
    <div id="menu">
        <h1 style="font-size: 24px; color: white;">Loading GoldHEN Exploits... Please Wait</h1>
        <!-- شريط النسب المئوية الأصلي للتهكيرة سيعد هنا فوراً -->
        <div id="progress">0%</div>
        <h1 style="margin-top: 300px; font-size: 18px;">Designed by: <span style="color: #f31414;">MAMDOUH BALEGH</span></h1>
    </div>

    <!-- أكواد تشغيل الثغرة والكاش التلقائي الأصلية بالكامل -->
    <script>
        var cache = window.applicationCache;
        function progress(e) {
            if (e.total) {
                var percent = Math.round((e.loaded / e.total) * 100);
                document.getElementById("progress").innerHTML = percent + "%";
                document.getElementById("msgs").innerHTML = "Caching Offline Files... Please Wait";
            }
        }
        function cached() {
            document.getElementById("msgs").innerHTML = "Host Cached Successfully! Reopen the Browser.";
            document.getElementById("progress").innerHTML = "100%";
        }
        function updateready() {
            cache.swapCache();
            document.getElementById("msgs").innerHTML = "Host Updated! Reopen the Browser.";
        }
        function error() {
            // إذا كان يعمل أونلاين أو تم التخزين مسبقاً سيبدأ الاستغلال فوراً
            document.getElementById("progress").innerHTML = "Ready!";
        }
        cache.addEventListener('progress', progress, false);
        cache.addEventListener('cached', cached, false);
        cache.addEventListener('updateready', updateready, false);
        cache.addEventListener('error', error, false);
        
        var histlength = history.length;
        history.go(-histlength + 2);
    </script>
</body>
</html>
